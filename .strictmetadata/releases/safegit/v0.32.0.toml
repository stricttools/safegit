# The next release of safegit. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "`scrub run` renames file and directory names with a recipe operation targeting paths, and a recipe operation's target now limits what it rewrites."
# Why these changes were made. Optional.
context = "A history scrub that removes a name must remove it from path names too, in the same single rewrite as the contents and messages."
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
release_commit = "c1d49104cfcd592fbf23bed6172a8ce39e2f100b"
[released_trees]
"." = "4054e08ed93f2157c49e500fd404b9f7d5e8843f"
