name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # This is the repository's ONE push-triggered test workflow, and the only
    # workflow named CI. The linux+macos matrix came from a hand-made second
    # workflow that was also named CI, which made the release's CI-check
    # resolution ambiguous and doubled the wait.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: protocol.file.allow
      GIT_CONFIG_VALUE_0: always
    steps:
      - uses: actions/checkout@v6
      # go.mod: go 1.25.7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # No -short: the multi-minute stress scenarios are opt-in behind the test
      # binary's own --stress flag, so an ordinary run is already the fast one
      # and -short would only silence unrelated tests.
      #
      # The budget is 30m because the macOS runner is roughly three times
      # slower on this suite than the linux one is WITH the race detector --
      # the suite spawns the safegit binary thousands of times and macOS pays
      # far more per spawn. Measured on the 0.29.0 release candidate: linux
      # 4m51s with -race, macOS 14m38s without it, and the attempt before that
      # one ran past a 15m budget and was killed mid-suite. A budget the suite
      # finishes against by twenty seconds is a red gate waiting to happen, so
      # the number is set well clear of the measurement rather than just above
      # it.
      - run: go test ./... ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} -timeout=30m
