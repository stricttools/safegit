# Optional context explaining why these changes were made
context = """
Infrastructure-only release. Expanded CLI help texts for selfdoc SEO compliance. \
Migrated pre-release hooks to config-driven format. Extracted duplicated commit count \
estimation into shared helper. Migrated tree_ops_test.go from os.Chdir to git.WithDir \
for test isolation.
"""
