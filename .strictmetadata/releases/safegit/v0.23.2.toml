# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Fix CI workflow missing protocol.file.allow env"
# Optional context explaining why these changes were made
context = "The ci-go.yml workflow was missing GIT_CONFIG env vars that ci.yml already had, causing submodule tests to fail on that runner."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go", "docker"]
exclude = []
release_commit = "3437546c2febf73cba48eaf2ea1a2823dd04e7d9"
[released_trees]
"." = "00470ba056737ab9ea10c1dddeec96b99de84fcc"
