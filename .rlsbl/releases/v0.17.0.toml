# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "Rename --force-push to --force-with-lease, remove --push from rewrite-author, fix doctor stale lock cleanup."
# Optional context explaining why these changes were made
context = """
Loose ends from the v0.16.0 --force removal: the --force-push flag name was misleading (it triggers --force-with-lease), \
rewrite-author --push bypassed safegit's push pipeline, and doctor --fix didn't clean stale locks in the main repo. \
Also added integration tests for unlock (previously untested) and doctor stale lock cleanup."""
include = ["go", "docker"]
exclude = []
candidate_sha = "c4dce876a8e948d701be82e8b90ec81a5fa09eb4"

